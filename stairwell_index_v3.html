<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stairwell index</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141412;--grey:#8b887f;--line:#e4e1d9;--accent:#c8341f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:#fff}

header{position:sticky;top:0;z-index:50;background:var(--bg);display:flex;align-items:center;padding:14px 24px;gap:26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.14em;cursor:pointer}
nav{display:flex;gap:18px;font-family:'Archivo';font-size:11px;letter-spacing:.14em}
nav a{cursor:pointer;color:var(--ink);text-decoration:none;padding-bottom:1px;border-bottom:1px solid transparent}
nav a.on,nav a:hover{border-bottom:1px solid var(--ink)}
nav a i{font-style:normal;color:var(--grey);margin-left:4px;font-size:10px}
.search{margin-left:auto;border:none;border-bottom:1px solid var(--line);background:transparent;font-family:inherit;font-size:12px;padding:4px 2px;outline:none;width:170px;transition:.25s}
.search:focus{border-bottom:1px solid var(--ink);width:220px}
.search::placeholder{color:var(--grey)}

.strip{display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px 12px;border-bottom:1px solid var(--line)}
.strip h1{font-family:'Archivo';font-weight:400;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
.strip h1 b{color:var(--ink);font-weight:700}
.strip span{font-family:'Archivo';font-size:11px;color:var(--grey)}

main{padding:20px 24px 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:34px 22px}
.book{cursor:pointer;animation:fade .5s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.cover{position:relative;aspect-ratio:10/13;overflow:hidden;border:1px solid var(--ink);background:#eee}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.book:hover .cover img{transform:scale(1.04)}
.mask{position:absolute;inset:0;background:rgba(20,20,18,.88);color:#f4f2ec;padding:16px;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}
.book:hover .mask{opacity:1}
.mask .m-code{font-family:'Archivo';font-size:10px;letter-spacing:.2em;color:#e8c832;margin-bottom:10px}
.mask p{font-size:11px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mask .more{margin-top:auto;font-family:'Archivo';font-size:10px;letter-spacing:.2em;text-transform:uppercase;align-self:flex-start;border-bottom:1px solid #e8c832;padding-bottom:2px}
.cap{padding-top:9px}
.cap .t{font-family:'Noto Serif SC',serif;font-weight:600;font-size:13.5px;line-height:1.5}
.cap .m{font-family:'Archivo';font-size:10.5px;color:var(--grey);margin-top:3px}
.cap .m b{color:var(--ink);font-weight:500}
.noresult{display:none;padding:70px 0;text-align:center;font-family:'Noto Serif SC';color:var(--grey)}

.overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:100;display:none;justify-content:center;overflow-y:auto;padding:4vh 16px}
.overlay.show{display:flex}
.modal{background:#fff;max-width:880px;width:100%;height:fit-content;animation:up .3s cubic-bezier(.2,.9,.3,1);position:relative}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.m-grid{display:grid;grid-template-columns:320px 1fr}
@media(max-width:680px){.m-grid{grid-template-columns:1fr}}
.m-grid .pic{border-right:1px solid var(--ink);background:#111}
.m-grid .pic img{width:100%;display:block;object-fit:cover}
.m-info{padding:26px 28px 30px}
.m-code{font-family:'Archivo';font-size:11px;letter-spacing:.22em;color:var(--accent);margin-bottom:12px}
.m-info h2{font-family:'Noto Serif SC',serif;font-weight:900;font-size:24px;line-height:1.4;margin-bottom:16px;padding-right:30px}
.m-rows{border-top:1px solid var(--ink)}
.m-rows>div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.m-rows small{font-family:'Archivo';font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);padding-top:3px}
.m-rows .full{line-height:1.9;font-size:13px}
.x{position:absolute;top:0;right:0;width:40px;height:40px;background:var(--ink);color:#fff;border:none;font-family:'Archivo';cursor:pointer;font-size:15px;z-index:2}
.x:hover{background:var(--accent)}
.m-link{display:inline-block;margin-top:20px;font-family:'Archivo';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--ink);padding:10px 18px;text-decoration:none}
.m-link:hover{background:var(--accent)}
footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-family:'Archivo';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="setF('ALL')">stairwell index</div>
  <nav>
    <a data-f="ALL" class="on">books<i>53</i></a>
    <a data-f="A">art<i>14</i></a>
    <a data-f="B">literature<i>16</i></a>
    <a data-f="C">society<i>11</i></a>

  </nav>
  <input class="search" id="q" placeholder="search…" oninput="render()">
</header>

<div class="strip">

</div>

<main>

</main>

  <div class="modal" id="modal"></div>
</div>

<footer><span>© 2026 stairwell index</span><span> upstairs, downstairs </span></footer>

<script>
const DATA = [{"cat": "A", "code": "A_01", "title": "虚构的监狱 蚀刻版画系列", "author": "乔瓦尼·巴蒂斯塔·皮拉内西", "year": "1750-1760s", "metaphor": "将通行过道异化为无法逃脱的空间迷宫", "desc": "在皮拉内西绘制的这些宏大、阴暗且荒诞的室内巨型建筑中，楼梯间与台阶是构筑空间的核心骨架。画作打破了现实中楼梯间“连接上下两层”的功能定义，楼梯间不再是安全的通行通道，而是构成了一个几何迷宫。皮拉内西通过巨大高耸的楼梯间井道，将“囚禁”的概念从具体的实体铁笼，升华为一种空间心理学上的压迫。无尽延伸的台阶隐喻着西西弗斯式的无休止攀爬与徒劳——即使你沿着楼梯间不断向上，也永远无法离开这个庞大的机械结构。", "link": "https://artmuseum.princeton.edu/art/collections/objects/86632", "image": "图像待补充", "gallery": [], "img": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22520%22%20viewBox%3D%220%200%20400%20520%22%3E%0A%3Crect%20width%3D%22400%22%20height%3D%22520%22%20fill%3D%22%23f4f2ec%22/%3E%0A%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22380%22%20height%3D%22500%22%20fill%3D%22none%22%20stroke%3D%22%23141412%22%20stroke-width%3D%222%22/%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%2252%22%20font-family%3D%22monospace%22%20font-size%3D%2213%22%20letter-spacing%3D%224%22%20fill%3D%22%23141412%22%3EA_01%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22140%22%20font-family%3D%22%27Noto%20Serif%20SC%27%2Cserif%22%20font-weight%3D%22900%22%20font-size%3D%2234%22%20fill%3D%22%23141412%22%3E%3Ctspan%20x%3D%2230%22%20dy%3D%220%22%3E%E8%99%9A%E6%9E%84%E7%9A%84%E7%9B%91%E7%8B%B1%20%E8%9A%80%3C/tspan%3E%3Ctspan%20x%3D%2230%22%20dy%3D%2240%22%3E%E5%88%BB%E7%89%88%E7%94%BB%E7%B3%BB%E5%88%97%3C/tspan%3E%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22200%22%20font-family%3D%22%27Noto%20Sans%20SC%27%2Csans-serif%22%20font-size%3D%2213%22%20fill%3D%22%23141412%22%20opacity%3D%220.75%22%3E%E4%B9%94%E7%93%A6%E5%B0%BC%C2%B7%E5%B7%B4%E8%92%82%E6%96%AF%E5%A1%94%C2%B7%E7%9A%AE%E6%8B%89%E5%86%85%E8%A5%BF%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22224%22%20font-family%3D%22monospace%22%20font-size%3D%2212%22%20fill%3D%22%23141412%22%20opacity%3D%220.55%22%3E1750-1760s%3C/text%3E%0A%3Ctext%20x%3D%22370%22%20y%3D%22495%22%20text-anchor%3D%22end%22%20font-family%3D%22monospace%22%20font-size%3D%2210%22%20letter-spacing%3D%223%22%20fill%3D%22%23141412%22%20opacity%3D%220.5%22%3ESTAIRWELL%20INDEX%3C/text%3E%0A%3C/svg%3E"}, {"cat": "A", "code": "A_02", "title": "相对性", "author": "M.C. 埃舍尔", "year": "1953", "metaphor": "违反物理规律的交错楼梯，表达相对主义与空间悖论", "desc": "这幅画描绘了一个充满悖论的建筑结构，其中重力定律似乎失效。建筑内有许多角度各异的楼梯。几个人物沿着楼梯的不同角度行走。对某些人物而言是墙壁的地方，对另一些人物而言却是地板。其中两个楼梯是双面的，一个人影倒立着走在另一个人影的下方。建筑内设有窗户和门，通往公园般的户外环境。这栋建筑似乎是某个田园般社区的中心，大多数居民悠闲地漫步，还有一位在户外餐桌旁用餐。然而，所有人物都穿着相同的服装，头部呈球状，没有任何特征。 画作以一个庞大的楼梯间为主体结构。埃舍尔在这个空间内设定了三个互相垂直的重力源，使得同一座楼梯间同时拥有不同的“上下”方向——对于某些人来说是向上攀爬的台阶，对于另一些重力维度的人来说则是侧面墙壁或天花板。楼梯间在这里不再是单一方向的通行工具，而是成为了错置不同重力物理法则的交汇场域。", "link": "https://escherinhetpaleis.nl/zh/%E5%85%B3%E4%BA%8E%E5%9F%83%E8%88%8D%E5%B0%94/%E6%9D%B0%E4%BD%9C/e79bb8e5afb9e680a7", "image": "图像待补充", "gallery": ["img/a02.jpg"], "img": "img/a02.jpg"}, {"cat": "A", "code": "A_03", "title": "Dancers Ascending a Staircase", "author": "埃德加·德加", "year": "约1880", "metaphor": "公共演出与私密休息在井道平台上的短暂交叠", "desc": "", "link": "", "image": "已收录图像 ×1", "img": "img/a03.jpg", "gallery": ["img/a03.jpg"]}, {"cat": "A", "code": "A_04", "title": "《迷魂记 Vertigo》中钟楼楼梯间的“滑动变焦镜头”", "author": "希区柯克", "year": "1958", "metaphor": "镜头变焦将封闭井道重构为吞噬理智的心理迷宫", "desc": "希区柯克利用古老钟楼内四墙围合的深邃垂直井道，将主角的恐高症（眩晕）具象化，也象征着他无法掌握局势、无法施救他人的无力感。画面中镜头拉远的同时镜头变焦推进，使楼梯间的底部看似被无限拉远延伸，原本封闭的安全通道转瞬间被异化为吞噬理智、重力失衡的心理深渊。", "link": "", "image": "已收录图像 ×1", "img": "img/a04.jpg", "gallery": ["img/a04.jpg"]}, {"cat": "A", "code": "A_05", "title": "勃拉芒介双螺旋楼梯", "author": "多纳托·布拉曼特（Donato Bramante）", "year": "1505", "metaphor": "坡道式双螺旋设计，人与牲畜分流，体现文艺复兴的严密秩序", "desc": "它是一个将“垂直井道”和“双重动线”发挥到极致的标杆性建筑空间。整个结构由两组互相交织却永不相交的螺旋坡道构成，置身于一个四周围合、顶部有穹顶自然光倾泻而下的宏大垂直筒状容器之中。", "link": "", "image": "已收录图像 ×1", "img": "img/a05.png", "gallery": ["img/a05.png"]}, {"cat": "A", "code": "A_06", "title": "Bauhaus Stairway", "author": "奥斯卡·施莱默", "year": "1932", "metaphor": "将人体与建筑阶梯几何化，探索现代工业空间中的秩序", "desc": "它是“楼梯间”作为现代主义理想与社会秩序容器的极致体现。施莱默没有将楼梯间视作阴暗的过渡通道，而是将其塑造成一个由光线、几何结构和高档钢化玻璃包围的三维透明容器。在这个包围空间内，学生的垂直向上流动象征着理智、工业文明与新时代的精神升华。", "link": "https://www.moma.org/collection/works/80049", "image": "已收录图像 ×1", "img": "img/a06.jpg", "gallery": ["img/a06.jpg"]}, {"cat": "A", "code": "A_07", "title": "Philosopher in Meditation", "author": "伦勃朗", "year": "1632", "metaphor": "盘旋而下的暗部楼梯，构建哲学家沉思的深邃心理阴影", "desc": "荷金时代大师伦勃朗的代表作。画面描绘了一座高耸、深邃的拱顶室内，一位老人坐在窗前沉思，而画面中央占据视觉焦点的，是一座巨大、盘旋向上的木质螺旋楼梯，微弱的光线从侧窗倾泻在楼梯底部与暗角处。", "link": "", "image": "已收录图像 ×1", "img": "img/a07.jpg", "gallery": ["img/a07.jpg"]}, {"cat": "A", "code": "A_8", "title": "Untitled (Stairs)", "author": "蕾切尔·怀特里德", "year": "2001", "metaphor": "被反转硬化的空气容器作为实体化幽闭记忆与负空间的几何巨构", "desc": "英国当代艺术家蕾切尔·怀特里德的代表性雕塑巨构。她对一座即将被拆除的维多利亚式住宅内部的楼梯间负空间（即梯井内部被墙体围合的空气与阴影）进行直接浇筑翻模，随后将原本包围楼梯间的建筑墙体剥离，使原本看不见的楼梯间内部容积被实体化呈现在展厅中。它是“楼梯间作为三维垂直容器”最纯粹的终极实体表达。怀特里德没有制作梯级本身，而是将四壁围合、贯穿多层的“负空间容器”凝固为石膏与树脂的硬质正形。原本隐藏在墙体内部的阴影、幽闭感与垂直流动性，被彻底反转为一座可以被环绕观看的巨大纪念碑。", "link": "", "image": "已收录图像 ×1", "img": "img/a08.jpg", "gallery": ["img/a08.jpg"]}, {"cat": "A", "code": "A_9", "title": "無限樓梯（Infinite Staircase）", "author": "雷安德罗·埃利希", "year": "2005-2020", "metaphor": "颠覆空间感知与身体直觉的视觉迷宫", "desc": "", "link": "https://loqueva.com/el-argentino-leandro-erlich-lo-hizo-de-nuevo-su-escalera-infinita-llego-a-japon/", "image": "已收录图像 ×2", "img": "img/a09a.jpg", "gallery": ["img/a09a.jpg", "img/a09b.jpg"]}, {"cat": "A", "code": "A-10", "title": "《意外空间》(The Incident, 2014)", "author": "伊萨克·埃斯班", "year": "2014", "metaphor": "被拓扑折叠的封闭梯井作为吞噬时间与困顿人生的荒谬牢笼", "desc": "墨西哥导演伊萨克·埃斯班执导的科幻悬疑电影。影片描绘了一对兄弟与一名警察被困在一个无限循环的九层公寓楼梯间内，无论向上还是向下走，都会永远回到同样的九层，时间与空间在此发生逻辑断层。它是“楼梯间”作为无限死循环与存在主义困局的极端形态。电影抓住了楼梯间“四壁围合、垂直延伸、连接上下”的几何特征，将其彻底异化为一个无法逃脱的三维时间/重力黑洞。在这个被墙体死死封锁的容器里，原本代表移动与通行的过渡空间，变为了吞噬生命、映射绝望与时间停滞的心理牢笼。", "link": "", "image": "已收录图像 ×2", "img": "img/a10a.jpg", "gallery": ["img/a10a.jpg", "img/a10b.jpg"]}, {"cat": "A", "code": "A-11", "title": "Untitled [Ophelia]", "author": "格雷戈里·克鲁森", "year": "2001", "metaphor": "矗立于水患深处的阴暗梯井作为通向精神异化与家庭危机深渊的心理容器", "desc": "格雷戈里·克鲁森最著名的剧场式摄影代表作之一。画面描绘了一间被水淹没的典型美国郊区住宅客厅与底楼，一名身穿衬裙的女性如奥菲莉亚般漂浮在水中，而背景深处正耸立着一座通往二楼暗处的住宅楼梯间。它是“楼梯间”作为连接意识与潜意识的垂直心理竖井的超现实呈现。在淹没的客厅（表层意识与日常现实）背后，那座贯穿上下、沉浸在阴影中的深邃梯井，构成了整个封闭空间内部唯一的垂直通道——它既是压抑情绪与家庭危机的蔓延源头，也是通向不可知精神深渊的垂直容器。", "link": "https://gagosian.com/exhibitions/2002/gregory-crewdson-twilight/    艺术家创作过程：https://gregorycrewdson.substack.com/p/the-making-of-ophelia", "image": "已收录图像 ×1", "img": "img/a11.jpg", "gallery": ["img/a11.jpg"]}, {"cat": "A", "code": "A-12", "title": "《楼梯间组画》（The Staircase Group）", "author": "查尔斯·威尔逊·皮尔（Charles Willson Peale）", "year": "1795", "metaphor": "木框与壁面围合的逼真梯井作为模糊现实与画境界限的心理错视容器", "desc": "美国艺术史上最著名的视错觉（Trompe-l'œil）肖像画巨作。皮尔描绘了他的两个儿子正在走上一座被墙体夹峙的狭窄室内楼梯间，并巧妙利用真木质门框与画作底部的真实第一级台阶，使画面与展厅墙面完美缝合。华盛顿曾被其逼真效果误导，对画中人点头致意。它是“楼梯间”作为虚实模糊的心理边界与视错觉容器的先驱表达。作品利用楼梯间典型的“四壁围合、向上延伸”的封闭几何特征，将真实展厅空间与画中潜藏的私密家庭梯井无缝相连，利用重力感与视觉陷阱，将原本死板的墙面转化为一个诱发窥探欲望与空间幻觉的三维容器。", "link": "https://philadelphiaencyclopedia.org/essays/staircase-group/#:~:text=(%20Philadelphia%20Museum%20of%20Art)%20After%20Charles,in%20American%20popular%20and%20art%20historical%20literature.", "image": "已收录图像 ×1", "img": "img/a12.jpg", "gallery": ["img/a12.jpg"]}, {"cat": "A", "code": "A-13", "title": "《楼梯间》（Stairway, 1949年）", "author": "爱德华·霍珀（Edward Hopper）", "year": "1949", "metaphor": "折射现代人精神疏离与存在停滞的心理容器", "desc": "它是“楼梯间”作为现代人疏离感与过渡性心理容器的视觉经典。霍珀将楼梯间转化为一个被墙体紧锁、充满几何张力的狭窄容器。在这个封闭的空间内，强烈的冷光与阴影分割着壁面，将原本用于通行的过渡地带异化为一种关于孤独、停滞与渴望逃离的心理竖井。", "link": "https://whitney.org/collection/works/6096", "image": "已收录图像 ×1", "img": "img/a13.jpg", "gallery": ["img/a13.jpg"]}, {"cat": "A", "code": "A-14", "title": "《楚门的世界》(The Truman Show, 1998)", "author": "彼得·威尔（Peter Weir）", "year": "1998", "metaphor": "梯井作为挣脱体制控制与通往主体自由的心理容器", "desc": "它是“楼梯间”作为打破虚妄体制、实现个体觉醒的终极心理出口。那座附着在巨大穹顶壁面上的极简楼梯间，是连接“楚门秀”这一虚构控制容器与真实外部世界的唯一垂直通道。四壁围合的狭窄梯井不再是困局，而是楚门从被凝视的虚构人生迈向真我存在的精神重力阈值。", "link": "", "image": "已收录图像 ×1", "img": "img/a14.jpg", "gallery": ["img/a14.jpg"]}, {"cat": "B", "code": "B-01", "title": "诗集《楼梯间，至少有一盏灯不会亮》", "author": "陈育律，酿出版", "year": "2022年", "metaphor": "以旧公寓楼梯间坏灯隐喻人格暗面，楼梯间=城市寄居者的内部地图。", "desc": "陈育律2022年出版的诗集，书名即以楼梯间为核心意象：旧公寓中“至少有一盏灯不会亮”的坏灯，成为现代人人格暗面的精准隐喻。楼梯间作为介于公私之间的过渡缝隙，既是日常通行的物理通道，也是城市寄居者向内探索的心理地图——灯光的缺失对应记忆与自我的盲区，整部诗集由此围绕这一空间展开对城市孤独与精神困境的书写。", "link": "", "image": "图像待补充", "gallery": [], "img": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22520%22%20viewBox%3D%220%200%20400%20520%22%3E%0A%3Crect%20width%3D%22400%22%20height%3D%22520%22%20fill%3D%22%23f4f2ec%22/%3E%0A%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22380%22%20height%3D%22500%22%20fill%3D%22none%22%20stroke%3D%22%23141412%22%20stroke-width%3D%222%22/%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%2252%22%20font-family%3D%22monospace%22%20font-size%3D%2213%22%20letter-spacing%3D%224%22%20fill%3D%22%23141412%22%3EB-01%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22140%22%20font-family%3D%22%27Noto%20Serif%20SC%27%2Cserif%22%20font-weight%3D%22900%22%20font-size%3D%2234%22%20fill%3D%22%23141412%22%3E%3Ctspan%20x%3D%2230%22%20dy%3D%220%22%3E%E8%AF%97%E9%9B%86%E3%80%8A%E6%A5%BC%E6%A2%AF%E9%97%B4%EF%BC%8C%3C/tspan%3E%3Ctspan%20x%3D%2230%22%20dy%3D%2240%22%3E%E8%87%B3%E5%B0%91%E6%9C%89%E4%B8%80%E7%9B%8F%E7%81%AF%E4%B8%8D%3C/tspan%3E%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22200%22%20font-family%3D%22%27Noto%20Sans%20SC%27%2Csans-serif%22%20font-size%3D%2213%22%20fill%3D%22%23141412%22%20opacity%3D%220.75%22%3E%E9%99%88%E8%82%B2%E5%BE%8B%EF%BC%8C%E9%85%BF%E5%87%BA%E7%89%88%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22224%22%20font-family%3D%22monospace%22%20font-size%3D%2212%22%20fill%3D%22%23141412%22%20opacity%3D%220.55%22%3E2022%E5%B9%B4%3C/text%3E%0A%3Ctext%20x%3D%22370%22%20y%3D%22495%22%20text-anchor%3D%22end%22%20font-family%3D%22monospace%22%20font-size%3D%2210%22%20letter-spacing%3D%223%22%20fill%3D%22%23141412%22%20opacity%3D%220.5%22%3ESTAIRWELL%20INDEX%3C/text%3E%0A%3C/svg%3E"}, {"cat": "B", "code": "B-02", "title": "《邪屋》（The Haunting of Hill House）的螺旋楼梯", "author": "雪莉·杰克逊", "year": "1959 年", "metaphor": "楼梯间是哥特式恐怖中\"建筑本身活着\"的核心场景，心理恐惧的空间化样本。", "desc": "雪莉·杰克逊1959年哥特式恐怖经典《邪屋》中，螺旋楼梯是“建筑本身活着”的核心场景。楼梯在此不再是无机的通行结构，而被赋予了缠绕与监视的主体性；它的螺旋形态不断折叠视线与方向感，使人物在上下往返中失去空间坐标。楼梯间由此成为心理恐惧的空间化样本——恐怖并非来自鬼魂显形，而来自建筑（即楼梯）对人的缓慢吞噬。", "link": "https://en.wikipedia.org/wiki/The_Haunting_of_Hill_House", "image": "图像待补充", "gallery": [], "img": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22520%22%20viewBox%3D%220%200%20400%20520%22%3E%0A%3Crect%20width%3D%22400%22%20height%3D%22520%22%20fill%3D%22%23f4f2ec%22/%3E%0A%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%22380%22%20height%3D%22500%22%20fill%3D%22none%22%20stroke%3D%22%23141412%22%20stroke-width%3D%222%22/%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%2252%22%20font-family%3D%22monospace%22%20font-size%3D%2213%22%20letter-spacing%3D%224%22%20fill%3D%22%23141412%22%3EB-02%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22140%22%20font-family%3D%22%27Noto%20Serif%20SC%27%2Cserif%22%20font-weight%3D%22900%22%20font-size%3D%2234%22%20fill%3D%22%23141412%22%3E%3Ctspan%20x%3D%2230%22%20dy%3D%220%22%3E%E3%80%8A%E9%82%AA%E5%B1%8B%E3%80%8B%EF%BC%88Th%3C/tspan%3E%3Ctspan%20x%3D%2230%22%20dy%3D%2240%22%3Ee%20Haunt%3C/tspan%3E%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22200%22%20font-family%3D%22%27Noto%20Sans%20SC%27%2Csans-serif%22%20font-size%3D%2213%22%20fill%3D%22%23141412%22%20opacity%3D%220.75%22%3E%E9%9B%AA%E8%8E%89%C2%B7%E6%9D%B0%E5%85%8B%E9%80%8A%3C/text%3E%0A%3Ctext%20x%3D%2230%22%20y%3D%22224%22%20font-family%3D%22monospace%22%20font-size%3D%2212%22%20fill%3D%22%23141412%22%20opacity%3D%220.55%22%3E1959%20%E5%B9%B4%3C/text%3E%0A%3Ctext%20x%3D%22370%22%20y%3D%22495%22%20text-anchor%3D%22end%22%20font-family%3D%22monospace%22%20font-size%3D%2210%22%20letter-spacing%3D%223%22%20fill%3D%22%23141412%22%20opacity%3D%220.5%22%3ESTAIRWELL%20INDEX%3C/text%3E%0A%3C/svg%3E"}, {"cat": "B", "code": "B-03", "title": "《蒂凡尼的早餐》的消防梯", "author": "杜鲁门·卡波特", "year": "1958 年", "metaphor": "公寓外的消防楼梯间是郝莉抱着吉他唱《月亮河           <div><small>年代</small><span>${esc(e.year)||'—'}</span></div>
          <div><small>空间隐喻</small><span>${esc(e.metaphor)||'—'}</span></div>
          ${e.desc?`<div><small>解释</small><span class="full">${esc(e.desc)}</span></div>`:''}
          <div><small>图片</small><span>${esc(e.image)}</span></div>
        </div>
        ${link}
      </div>
    </div>`;
  document.getElementById('ov').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeM(){document.getElementById('ov').classList.remove('show');document.body.style.overflow=''}
function setF(f){cur=f;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.f===f));render()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>setF(a.dataset.f));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
</html>
